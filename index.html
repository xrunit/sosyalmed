<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vercell</title>
<style>
:root{--bg:#f6f5f1;--surf:#fff;--tx:#1d1d1b;--mut:#77756e;--br:#e3e1d9;--acc:#5b4bdb;--acct:#fff;--mine:#5b4bdb;--minet:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--surf:#1e1e23;--tx:#ececf0;--mut:#9a98a3;--br:#2e2e35;--acc:#8b7dff;--acct:#101014;--mine:#6a5cf0;--minet:#fff}}
:root[data-theme="dark"]{--bg:#141417;--surf:#1e1e23;--tx:#ececf0;--mut:#9a98a3;--br:#2e2e35;--acc:#8b7dff;--acct:#101014;--mine:#6a5cf0;--minet:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--br)}
.logo{font-weight:800;font-size:20px;color:var(--acc);letter-spacing:-.5px}
#me{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
nav{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;background:var(--surf);border-bottom:1px solid var(--br)}
nav button{flex:none;border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;align-self:flex-start}
.m .n{font-size:12px;color:var(--mut);margin:0 6px 2px}
.m .b{background:var(--surf);border:1px solid var(--br);padding:8px 12px;border-radius:16px 16px 16px 4px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end}
.m.me .n{text-align:right}
.m.me .b{background:var(--mine);color:var(--minet);border-color:var(--mine);border-radius:16px 16px 4px 16px}
.m .t{font-size:11px;color:var(--mut);margin:2px 6px}
.m.me .t{text-align:right}
.empty,.gate{margin:auto;text-align:center;color:var(--mut);padding:24px}
form,.comp{display:flex;gap:8px;padding:10px 14px;background:var(--surf);border-top:1px solid var(--br)}
.comp input{flex:1;min-width:0;border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:999px;padding:10px 16px;font:inherit}
.comp button{border:0;background:var(--acc);color:var(--acct);border-radius:999px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.comp button:disabled{opacity:.5}
.gate h2{color:var(--tx);margin:0 0 6px}

.row{display:flex;gap:8px;align-items:flex-end;max-width:85%;align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .m{max-width:100%;align-self:auto}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px}
.b img{display:block;max-width:100%;max-height:300px;border-radius:10px;cursor:pointer}
.b img+span{display:block;margin-top:6px}
#typ{height:18px;padding:0 16px;font-size:12px;color:var(--mut);background:var(--bg)}
.ic{border:1px solid var(--br)!important;background:var(--bg)!important;color:var(--tx)!important;padding:0 12px!important}
#me{cursor:pointer}
#pm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#pm.on{display:flex}
#pm .c{background:var(--surf);border-radius:16px;padding:18px;width:100%;max-width:360px}
#pm h3{margin:0 0 12px}
#pm input{width:100%;border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin-bottom:12px}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.g button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;background:var(--bg);font-size:20px;cursor:pointer;padding:0}
.g button.sel{border-color:var(--acc)}
.pv{display:flex;justify-content:center;margin-bottom:12px}.pv .av{width:64px;height:64px;font-size:34px}
.acts{display:flex;gap:8px;justify-content:flex-end}.acts button{border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;background:var(--bg);color:var(--tx)}.acts .ok{background:var(--acc);color:var(--acct);font-weight:600}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.comp{gap:6px}.ic{padding:0 10px!important;font-size:16px}
.rec{background:#d33!important;color:#fff!important;border-color:#d33!important}
audio{display:block;width:220px;max-width:100%;height:36px}
#gm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#gm.on{display:flex}
#gm .c{background:var(--surf);border-radius:16px;padding:18px;width:100%;max-width:380px}
#gm h3{margin:0 0 6px}#gm p{margin:0 0 10px;font-size:13px;color:var(--mut)}
#gt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:56px}
#gm select{border:1px solid var(--br);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px}
.gb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.gb button,#gm .acts button{border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;background:var(--bg);color:var(--tx)}
#gm .acts .ok{background:var(--acc);color:var(--acct);font-weight:600}#gm .acts .ok:disabled{opacity:.5}
#login{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:24px;text-align:center;overflow-y:auto}
#login.on{display:flex}#login .logo{font-size:40px}#login button{border:0;background:var(--acc);color:var(--acct);border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}#login p{color:var(--mut);margin:0;max-width:320px}
#login .auth{width:100%;max-width:360px;display:grid;gap:10px}
#login .auth input{width:100%;border:1px solid var(--br);background:var(--surf);color:var(--tx);border-radius:10px;padding:12px;font:inherit;text-align:left}
#login .auth [hidden]{display:none}
#login #lb{width:100%;max-width:360px;background:var(--surf);color:var(--tx);border:1px solid var(--br)}
#login .divider{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;color:var(--mut);font-size:13px}
#login .divider:before,#login .divider:after{content:"";height:1px;background:var(--br);flex:1}
#login #authError{color:#d33;font-size:14px;min-height:0}
#login #authError:empty{display:none}
#login #authMode{background:transparent;color:var(--acc);padding:4px}
#login button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<header><span class="logo">Vercell</span><span class="me" id="me"></span></header>
<nav id="rooms"></nav>
<div id="msgs"><div class="empty">Yükleniyor…</div></div>
<div id="typ"></div>
<div class="comp"><button class="ic" id="pg" hidden title="Galeri">🖼</button><button class="ic" id="pcam" hidden title="Kamera">📷</button><button class="ic" id="pgif" hidden title="GIF yap">🎞</button><button class="ic" id="mic" hidden title="Sesli mesaj">🎤</button><input type="file" id="fg" accept="image/*" hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden><input id="inp" placeholder="Mesaj yaz…" maxlength="1000" autocomplete="off" disabled><button id="send" disabled>Gönder</button></div>
<div id="login"><span class="logo">Vercell</span><p id="lm">Sohbete katılmak için giriş yap veya yeni hesap oluştur.</p><button id="lb" type="button">Google ile giriş yap</button><div class="divider" id="authDivider">veya e-posta ile</div><form class="auth" id="authForm"><input id="authName" type="text" maxlength="24" autocomplete="name" placeholder="Görünen ad" aria-label="Görünen ad" hidden><input id="authEmail" type="email" autocomplete="email" placeholder="E-posta" aria-label="E-posta" required><input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="Şifre (en az 6 karakter)" aria-label="Şifre" required><button id="authSubmit" type="submit">Giriş yap</button><p id="authError" role="alert" aria-live="polite"></p></form><button id="authMode" type="button">Hesabın yok mu? Kayıt ol</button></div>
<div id="pm"><div class="c"><h3>Profilim</h3><div class="pv"><div class="av" id="pv"></div></div><div class="gb" style="justify-content:center"><button id="pfg">🖼 Galeri</button><button id="pfc">📷 Kamera</button><button id="pfx">Fotoğrafı kaldır</button></div><input type="file" id="fpg" accept="image/*" hidden><input type="file" id="fpc" accept="image/*" capture="user" hidden><input id="pn" maxlength="24" placeholder="Görünen ad"><div class="g" id="pe"></div><div class="g" id="pcl"></div><div class="acts"><button id="out">Çıkış</button><button id="pc">İptal</button><button class="ok" id="ps">Kaydet</button></div></div></div>
<div id="gm"><div class="c"><h3>GIF yap</h3><p>2–12 fotoğraf ekle (galeriden veya kameradan). Kaldırmak için küçük resme dokun.</p><div id="gt"></div><div class="gb"><button id="gg">🖼 Galeri</button><button id="gc">📷 Kamera</button><label>Hız <select id="gs"><option value="60">Yavaş</option><option value="35" selected>Orta</option><option value="15">Hızlı</option></select></label></div><input type="file" id="fgm" accept="image/*" multiple hidden><input type="file" id="fgc" accept="image/*" capture="environment" hidden><div class="acts"><button id="gx">İptal</button><button class="ok" id="gok" disabled>Gönder</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var db=null,user=null,assets=null,room=null,uid=null,cur="genel",unsubM=null,names={},profs={},lastDocs=[],typing={},rooms=[{id:"genel",name:"Genel"}];
var EM=["😀","😎","🦊","🐱","🐼","🦄","🔥","🌈","🚀","🎧","🍕","👾"],CL=["#5b4bdb","#e0457b","#e8833a","#2fa66a","#2b8fd9","#8a5cd0"];
var $=function(i){return document.getElementById(i)};
function gate(t,s){var m=$("msgs");m.innerHTML="";var d=document.createElement("div");d.className="gate";var h=document.createElement("h2");h.textContent=t;var p=document.createElement("div");p.textContent=s;d.appendChild(h);d.appendChild(p);m.appendChild(d)}
function nameOf(u){return (profs[u]&&profs[u].name)||names[u]||"Biri"}
function isId(x){return typeof x==="string"&&/^[0-9a-f]{32}$/.test(x)}
function avatar(u){var d=document.createElement("div");d.className="av";var p=profs[u]||{};d.style.background=CL.indexOf(p.color)>=0?p.color:CL[0];
 if(isId(p.photo)){var im=document.createElement("img");im.src=BU+p.photo;im.alt="";d.appendChild(im);return d}
 if(EM.indexOf(p.emoji)>=0)d.textContent=p.emoji;else{d.textContent=(nameOf(u)[0]||"?").toUpperCase();d.style.color="#fff";d.style.fontSize="15px";d.style.fontWeight="700"}return d}
function drawRooms(){var n=$("rooms");n.innerHTML="";rooms.forEach(function(r){var b=document.createElement("button");b.textContent="# "+r.name;if(r.id===cur)b.className="on";b.onclick=function(){openRoom(r.id)};n.appendChild(b)});
var a=document.createElement("button");a.textContent="+ Yeni oda";a.onclick=newRoom;n.appendChild(a)}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9ğüşöçı]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||("oda-"+Date.now())}
function newRoom(){var name=prompt("Oda adı?");if(!name||!name.trim())return;name=name.trim().slice(0,30);var id=slug(name);
db.doc("rooms/"+id).set({name:name,ts:Date.now()}).then(function(){openRoom(id)}).catch(function(){alert("Oda oluşturulamadı.")})}
function fmt(ts){return new Date(ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}
async function render(docs){
  lastDocs=docs;var ids=[];docs.forEach(function(d){var u=d.data().uid;if(u&&!names[u]&&ids.indexOf(u)<0)ids.push(u)});
  if(ids.length){try{var ps=await user.profiles(ids);ids.forEach(function(i){names[i]=(ps[i]&&ps[i].name)||"Biri"})}catch(e){ids.forEach(function(i){names[i]="Biri"})}}
  var m=$("msgs"),near=m.scrollHeight-m.scrollTop-m.clientHeight<120;m.innerHTML="";
  if(!docs.length){var e=document.createElement("div");e.className="empty";e.textContent="Henüz mesaj yok. İlk mesajı sen yaz!";m.appendChild(e);return}
  docs.forEach(function(d){var x=d.data(),mine=x.uid===uid;var r=document.createElement("div");r.className="row"+(mine?" me":"");
    r.appendChild(avatar(x.uid));var w=document.createElement("div");w.className="m"+(mine?" me":"");
    if(!mine){var n=document.createElement("div");n.className="n";n.textContent=nameOf(x.uid);w.appendChild(n)}
    var b=document.createElement("div");b.className="b";
    if(x.img&&/^[0-9a-f]{32}$/.test(x.img)){var im=document.createElement("img");im.src=BU+x.img;im.alt="Fotoğraf";im.onclick=function(){window.open(im.src,"_blank")};b.appendChild(im)}
    if(isId(x.audio)){var au=document.createElement("audio");au.controls=true;au.preload="none";au.src=BU+x.audio;b.appendChild(au)}
    if(x.text){var sp=document.createElement("span");sp.textContent=x.text;b.appendChild(sp)}
    w.appendChild(b);var t=document.createElement("div");t.className="t";t.textContent=fmt(x.ts);
    if(mine){var del=document.createElement("span");del.textContent=" · Sil";del.style.cursor="pointer";del.onclick=function(){if(confirm("Mesaj silinsin mi?"))db.doc("rooms/"+cur+"/msgs/"+d.id).delete().catch(function(){alert("Silinemedi.")})};t.appendChild(del)}
    w.appendChild(t);r.appendChild(w);m.appendChild(r)});
  if(near||m.dataset.first!==cur){m.scrollTop=m.scrollHeight;m.dataset.first=cur}
}
function openRoom(id){cur=id;typing={};showTyping();drawRooms();if(unsubM)unsubM();$("msgs").innerHTML='<div class="empty">Yükleniyor…</div>';$("msgs").dataset.first="";
  unsubM=db.collection("rooms/"+id+"/msgs").orderBy("ts","asc").limit(200).onSnapshot(function(s){render(s.docs)},function(){gate("Hata","Mesajlar yüklenemedi.")})}
function add(o){o.uid=uid;o.ts=Date.now();return db.collection("rooms/"+cur+"/msgs").add(o)}
function send(){var v=$("inp").value.trim();if(!v)return;$("inp").value="";add({text:v}).catch(function(){$("inp").value=v;alert("Gönderilemedi. Yazma iznin olmayabilir.")})}
/* yazıyor */
var lastEmit=0;
function emitTyping(){var n=Date.now();if(!room||n-lastEmit<2000)return;lastEmit=n;room.emit("typing",{room:cur}).catch(function(){})}
function showTyping(){var n=Date.now(),a=[];Object.keys(typing).forEach(function(u){if(n-typing[u]<3500)a.push(nameOf(u));else delete typing[u]});
  $("typ").textContent=a.length?(a.length>2?"Birkaç kişi yazıyor…":a.join(", ")+" yazıyor…"):""}
setInterval(showTyping,1000);
/* fotoğraf / ses / gif */
function shrink(f,max,sq){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var c=document.createElement("canvas"),g=c.getContext("2d");
  if(sq){var s=Math.min(im.width,im.height);c.width=c.height=max;g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
  else{var k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);g.drawImage(im,0,0,c.width,c.height)}
  URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.82)};im.onerror=no;im.src=u})}
function errm(e){return (e&&(e.code||e.message))||String(e)}
function need(){if(assets)return true;alert("Yükleme izni yok. Sayfa sahibi seni Katkıda bulunan olarak eklemeli ve Claude hesabınla giriş yapmalısın.");return false}
function busy(v){["pg","pcam","pgif","mic"].forEach(function(i){$(i).disabled=v})}
async function sendPhoto(f){if(!f||!/^image\//.test(f.type)||!need())return;busy(true);
  try{var b=f.type==="image/gif"?f:await shrink(f,1280),r=await assets.upload(b);await add({img:r.id,text:""})}catch(e){alert("Gönderilemedi.: "+errm(e))}
  busy(false);$("fg").value="";$("fc").value=""}
var rec=null,rtm=0;
async function toggleRec(){
  if(!rec&&(!need()||!window.MediaRecorder||!navigator.mediaDevices)){if(assets)alert("Bu tarayıcı ses kaydını desteklemiyor.");return}
  if(rec){rec.stop();return}
  var st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert("Mikrofon açılamadı: "+errm(e));return}
  var web=MediaRecorder.isTypeSupported("audio/webm"),ch=[],t0=Date.now();
  rec=new MediaRecorder(st,web?{mimeType:"audio/webm"}:undefined);
  rec.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
  rec.onstop=async function(){st.getTracks().forEach(function(t){t.stop()});clearInterval(rtm);rec=null;$("mic").textContent="🎤";$("mic").classList.remove("rec");
    if(ch.length&&Date.now()-t0>600){busy(true);try{var b=new Blob(ch,{type:web?"audio/webm":"audio/mp4"}),r=await assets.upload(b);await add({audio:r.id,text:""})}catch(e){alert("Sesli mesaj gönderilemedi.: "+errm(e))}busy(false)}};
  rec.start();$("mic").classList.add("rec");rtm=setInterval(function(){var n=Math.round((Date.now()-t0)/1000);$("mic").textContent="⏹ "+n+"s";if(n>=60)rec.stop()},500)}
/* GIF üretici: 8 bit renk (3-3-2), kendi LZW kodlayıcımız */
function lzw(ix){var out=[],cur=0,bits=0,cs=9,nx=258,d=new Map();function put(c){cur|=c<<bits;bits+=cs;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8}}
  put(256);var p=ix[0];for(var i=1;i<ix.length;i++){var k=ix[i],key=p*256+k,v=d.get(key);
    if(v!==undefined){p=v}else{put(p);if(nx<4096){d.set(key,nx++);if(nx>(1<<cs)&&cs<12)cs++}else{put(256);d.clear();nx=258;cs=9}p=k}}
  put(p);put(257);if(bits>0)out.push(cur&255);return out}
function encodeGIF(fr,w,h,dl){var o=[71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,247,0,0];
  for(var i=0;i<256;i++)o.push(Math.round(((i>>5)&7)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));
  o.push(33,255,11,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0);
  fr.forEach(function(ix){o.push(33,249,4,0,dl&255,dl>>8,0,0,44,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8);
    var z=lzw(ix);for(var p=0;p<z.length;p+=255){var n=Math.min(255,z.length-p);o.push(n);for(var q=0;q<n;q++)o.push(z[p+q])}o.push(0)});
  o.push(59);return new Uint8Array(o)}
var gifFiles=[];
function gmDraw(){var t=$("gt");t.innerHTML="";gifFiles.forEach(function(f,i){var im=document.createElement("img");im.src=URL.createObjectURL(f);im.style.cssText="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer";im.onclick=function(){gifFiles.splice(i,1);gmDraw()};t.appendChild(im)});$("gok").disabled=gifFiles.length<2}
function gmAdd(fs){[].forEach.call(fs,function(f){if(/^image\//.test(f.type)&&gifFiles.length<12)gifFiles.push(f)});gmDraw();$("fgm").value="";$("fgc").value=""}
async function makeGif(){if(!need())return;var ok=$("gok");ok.disabled=true;ok.textContent="Hazırlanıyor…";
  try{var bm=await Promise.all(gifFiles.map(function(f){return createImageBitmap(f)}));
    var k=Math.min(1,320/Math.max(bm[0].width,bm[0].height)),w=Math.max(2,Math.round(bm[0].width*k)),h=Math.max(2,Math.round(bm[0].height*k));
    var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),fr=[];
    bm.forEach(function(b){var s=Math.max(w/b.width,h/b.height),dw=b.width*s,dh=b.height*s;g.fillStyle="#000";g.fillRect(0,0,w,h);g.drawImage(b,(w-dw)/2,(h-dh)/2,dw,dh);
      var px=g.getImageData(0,0,w,h).data,ix=new Uint8Array(w*h);for(var i=0;i<ix.length;i++)ix[i]=(px[i*4]>>5<<5)|(px[i*4+1]>>5<<2)|(px[i*4+2]>>6);fr.push(ix)});
    var blob=new Blob([encodeGIF(fr,w,h,+$("gs").value)],{type:"image/gif"}),r=await assets.upload(blob);await add({img:r.id,text:""});
    $("gm").className="";gifFiles=[]}catch(e){alert("GIF oluşturulamadı.: "+errm(e))}
  ok.textContent="Gönder";gmDraw()}
/* profil */
var draft={};
function pvDraw(){var p=$("pv");p.innerHTML="";p.style.background=draft.color;
  if(isId(draft.photo)){var im=document.createElement("img");im.src=BU+draft.photo;p.appendChild(im)}else p.textContent=draft.emoji;
  [].forEach.call($("pe").children,function(b){b.className=!draft.photo&&b.textContent===draft.emoji?"sel":""});
  [].forEach.call($("pcl").children,function(b){b.className=b.dataset.c===draft.color?"sel":""})}
function openProf(){var p=profs[uid]||{};draft={emoji:EM.indexOf(p.emoji)>=0?p.emoji:EM[0],color:CL.indexOf(p.color)>=0?p.color:CL[0],photo:isId(p.photo)?p.photo:""};
  $("pn").value=p.name||names[uid]||"";$("pe").innerHTML="";$("pcl").innerHTML="";
  EM.forEach(function(e){var b=document.createElement("button");b.textContent=e;b.onclick=function(){draft.emoji=e;draft.photo="";pvDraw()};$("pe").appendChild(b)});
  CL.forEach(function(c){var b=document.createElement("button");b.dataset.c=c;b.style.background=c;b.onclick=function(){draft.color=c;pvDraw()};$("pcl").appendChild(b)});
  pvDraw();$("pm").className="on"}

$("fgm").onchange=function(){gmAdd($("fgm").files)};$("fgc").onchange=function(){gmAdd($("fgc").files)};$("gok").onclick=makeGif;

async function startApp(){
  drawRooms();
  try{db=await claude.use("db");user=await claude.use("user")}catch(e){}
  if(!db||!user){gate("Vercell","Sohbet için Claude hesabınla giriş yapman gerekiyor.");return}
  uid=await user.id();var me=await user.me();names[uid]=me.name||"Sen";
  try{assets=await claude.use("assets")}catch(e){}["pg","pcam","pgif","mic"].forEach(function(i){$(i).hidden=false});
  try{room=await claude.use("room");if(room)room.on("typing",function(m){if(m.isMe||!m.by||!m.data||m.data.room!==cur)return;typing[m.by]=Date.now();showTyping()})}catch(e){}
  var canW=user.can("data.write")!==false;
  $("inp").disabled=!canW;$("send").disabled=!canW;busy(!canW);if(!canW)$("inp").placeholder="Yazma iznin yok (yalnızca okuyabilirsin)";
  db.collection("profiles").onSnapshot(function(s){profs={};s.docs.forEach(function(d){profs[d.id]=d.data()});if(!profs[uid]&&!window.__seed){window.__seed=1;db.doc("profiles/"+uid).set({name:names[uid]||"",emoji:"",color:CL[0],photo:""})}$("me").textContent=nameOf(uid)+" ✎";if(lastDocs.length)render(lastDocs)},function(){});
  db.collection("rooms").onSnapshot(function(s){
    var map={genel:{id:"genel",name:"Genel"}};s.docs.forEach(function(d){map[d.id]={id:d.id,name:d.data().name||d.id}});
    rooms=Object.keys(map).map(function(k){return map[k]});drawRooms()},function(){});
  $("me").textContent=nameOf(uid)+" ✎";openRoom("genel");
}

/* ---- Supabase bağdaştırıcısı: uygulama kodunu değiştirmeden db/user/assets/room sağlar ---- */
var CFG=window.VERCELL_CONFIG||{},BU=(CFG.url||"")+"/storage/v1/object/public/media/",sb=null,ME=null;
function rid(){return crypto.randomUUID().replace(/-/g,"")}
function split(p){var i=p.lastIndexOf("/");return {c:p.slice(0,i),id:p.slice(i+1)}}
function chk(r){if(r&&r.error)throw r.error;return r}
function mkDb(){
  function put(c,id,d){return sb.from("docs").upsert({collection:c,id:id,data:d}).then(chk)}
  function col(path){var f={o:null,l:500},q={};
    q.orderBy=function(x){f.o=x;return q};q.limit=function(n){f.l=n;return q};
    q.add=function(d){return put(path,rid(),d)};
    q.onSnapshot=function(next,err){var rows=[];
      function emit(){var r=rows.slice();if(f.o)r.sort(function(a,b){return (a.data[f.o]||0)-(b.data[f.o]||0)});
        var docs=r.slice(-f.l).map(function(x){return {id:x.id,data:function(){return x.data}}});next({docs:docs,size:docs.length,empty:!docs.length})}
      function drop(id){rows=rows.filter(function(x){return x.id!==id})}
      sb.from("docs").select("id,data").eq("collection",path).limit(1000).then(function(r){if(r.error){if(err)err(r.error);return}rows=r.data;emit()});
      var ch=sb.channel("c"+rid()).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"collection=eq."+path},function(p){
          if(p.eventType==="DELETE")drop(p.old.id);else{drop(p.new.id);rows.push({id:p.new.id,data:p.new.data})}emit()})
        .on("postgres_changes",{event:"DELETE",schema:"public",table:"docs"},function(p){if(p.old&&p.old.collection===path){drop(p.old.id);emit()}}).subscribe();
      return function(){sb.removeChannel(ch)}};
    return q}
  return {collection:col,doc:function(p){var x=split(p);return {set:function(d){return put(x.c,x.id,d)},delete:function(){return sb.from("docs").delete().eq("collection",x.c).eq("id",x.id).then(chk)}}}}}
function mkRoom(){var ch=sb.channel("typing"),on=false;function go(){if(!on){on=true;ch.subscribe()}}
  return {on:function(t,h){ch.on("broadcast",{event:t},function(p){h({isMe:false,by:p.payload.by,data:p.payload.data})});setTimeout(go,0);return function(){}},
    emit:function(t,d){go();return ch.send({type:"broadcast",event:t,payload:{by:ME.id,data:d}})}}}
function mkAssets(){return {upload:function(b){var id=rid();return sb.storage.from("media").upload(id,b,{contentType:b.type||"application/octet-stream"}).then(chk).then(function(){return {id:id,url:BU+id}})}}}
async function boot(){
  if(!CFG.url||!CFG.anonKey||/YOUR/.test(CFG.url)||!window.supabase){$("login").className="on";$("lm").textContent="Supabase bağlantısı yapılandırılmamış. Lütfen config.js ayarlarını kontrol et.";["lb","authDivider","authForm","authMode"].forEach(function(i){$(i).hidden=true});return}
  sb=supabase.createClient(CFG.url,CFG.anonKey);
  var r=await sb.auth.getSession();
  if(r.error){$("login").className="on";$("authError").textContent=r.error.message;return}
  var ses=r.data.session;
  if(!ses){$("login").className="on";return}
  $("login").className="";var u=ses.user;ME={id:u.id,name:(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||(u.email||"").split("@")[0]};
  var D=mkDb(),R=mkRoom(),A=mkAssets(),U={id:function(){return Promise.resolve(ME.id)},me:function(){return Promise.resolve({name:ME.name})},profiles:function(ids){var o={};[].concat(ids).forEach(function(i){o[i]={name:""}});return Promise.resolve(o)},can:function(){return true}};
  window.claude={use:function(n){return Promise.resolve({db:D,user:U,assets:A,room:R}[n]||null)}};
  $("out").onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
  sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")location.reload()});
  startApp()}
var registering=false;
function setAuthMode(createAccount){
  registering=createAccount;
  $("authName").hidden=!createAccount;
  $("authName").required=createAccount;
  $("authPassword").autocomplete=createAccount?"new-password":"current-password";
  $("authSubmit").textContent=createAccount?"Kayıt ol":"Giriş yap";
  $("authMode").textContent=createAccount?"Zaten hesabın var mı? Giriş yap":"Hesabın yok mu? Kayıt ol";
  $("authError").textContent="";
}
function setAuthBusy(busy){
  ["lb","authSubmit","authMode"].forEach(function(i){$(i).disabled=busy});
}
$("authMode").onclick=function(){setAuthMode(!registering)};
$("authForm").onsubmit=async function(e){
  e.preventDefault();
  if(!sb)return;
  var email=$("authEmail").value.trim(),password=$("authPassword").value;
  setAuthBusy(true);$("authError").textContent="";
  try{
    var result=registering
      ?await sb.auth.signUp({email:email,password:password,options:{data:{name:$("authName").value.trim(),full_name:$("authName").value.trim()},emailRedirectTo:location.origin+location.pathname}})
      :await sb.auth.signInWithPassword({email:email,password:password});
    if(result.error)throw result.error;
    if(registering&&!result.data.session){
      $("authError").style.color="var(--mut)";
      $("authError").textContent="Kayıt başarılı. Giriş yapmadan önce e-posta adresine gönderilen doğrulama bağlantısını aç.";
      return;
    }
    location.reload();
  }catch(err){
    $("authError").style.color="#d33";
    $("authError").textContent=err&&err.message?err.message:"Kimlik doğrulama başarısız oldu.";
  }finally{setAuthBusy(false)}
};
$("lb").onclick=async function(){
  if(!sb)return;
  setAuthBusy(true);$("authError").textContent="";
  try{
    var result=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(result.error)throw result.error;
  }catch(err){
    $("authError").style.color="#d33";
    $("authError").textContent=err&&err.message?err.message:"Google ile giriş başlatılamadı.";
    setAuthBusy(false);
  }
};
boot();
</script>
